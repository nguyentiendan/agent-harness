# LiteLLM Proxy (AI Gateway) configuration.
#
# This gateway sits between the harness backend and the LLM providers. It gives:
#   - the Admin UI dashboard: http://localhost:4000/ui  (user: admin, password: LITELLM_MASTER_KEY)
#   - virtual keys per user/team, with budgets and rate limits
#   - per-request spend / token / latency logs and tool-call tracing
#   - one place that holds the provider API keys (the backend never sees them)
#
# The model_name entries below are the model names the harness sends.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: claude-3-7-sonnet-20250219
    litellm_params:
      model: anthropic/claude-3-7-sonnet-20250219
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: deepseek/deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek/deepseek-reasoner
    litellm_params:
      model: deepseek/deepseek-reasoner
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: gemini/gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: ollama/llama3.3
    litellm_params:
      model: ollama/llama3.3
      api_base: os.environ/OLLAMA_API_BASE

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Accounting only: do not retain chat content in gateway spend logs.
  store_prompts_in_spend_logs: false

litellm_settings:
  # Ignore provider params a given model does not support (keeps one client config).
  drop_params: true
  turn_off_message_logging: true

router_settings:
  num_retries: 0
