services:
  sandbox-image:
    image: harness-sandbox:local
    build: ./sandbox
    profiles: ["build"]
  sandbox-runner:
    build: ./sandbox_runner
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?Set RUNNER_TOKEN in .env}
      SANDBOX_IMAGE: harness-sandbox:local
      RUNNER_NAMESPACE: harness
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_state:/state
    networks: [runner_control]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/health',headers={'Authorization':'Bearer '+os.environ['RUNNER_TOKEN']}),timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  platform-db:
    image: postgres:16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      POSTGRES_DB: platform
    volumes:
      - platform_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        # On Linux, set HARNESS_UID/HARNESS_GID to your host `id -u` / `id -g`
        # so the unprivileged container user can write the mounted volumes.
        UID: ${HARNESS_UID:-10001}
        GID: ${HARNESS_GID:-10001}
    networks: [default, runner_control]
    container_name: harness-backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Provider API keys live ONLY in the LiteLLM gateway, not here.
      - PLATFORM_DATABASE_URL=postgresql+psycopg://platform:${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}@platform-db:5432/platform
      - RUNNER_URL=http://sandbox-runner:8080
      - RUNNER_TOKEN=${RUNNER_TOKEN:?Set RUNNER_TOKEN in .env}
      - SANDBOX_ENABLED=true
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:3000}
      - HARNESS_CONFIG=config.yaml
      - WORKSPACES_ROOT=/app/workspaces
      - HARNESS_DATA_DIR=/app/data
      # Route every model call through the gateway (dashboards, keys, budgets).
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm:4000}
      - PLATFORM_LIMITS_ENABLED=true
      - PLATFORM_KEY_ENCRYPTION_KEY=${PLATFORM_KEY_ENCRYPTION_KEY:?Set PLATFORM_KEY_ENCRYPTION_KEY in .env}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
    depends_on:
      sandbox-runner:
        condition: service_healthy
      platform-db:
        condition: service_healthy
      litellm:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: harness-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ------------------------------------------------------------------
  # LiteLLM Proxy (AI Gateway) + its Postgres: admin UI, virtual keys,
  # spend/token logs. Open http://localhost:4000/ui (admin / LITELLM_MASTER_KEY).
  # ------------------------------------------------------------------
  litellm:
    image: docker.litellm.ai/berriai/litellm@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802
    container_name: harness-litellm
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env}
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@litellm-db:5432/litellm
      - STORE_MODEL_IN_DB=True
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    depends_on:
      litellm-db:
        condition: service_healthy
    restart: unless-stopped

  litellm-db:
    image: postgres:16
    container_name: harness-litellm-db
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-litellm}
      - POSTGRES_DB=litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - litellm_db:/var/lib/postgresql/data
    restart: unless-stopped

networks:
  runner_control:
    internal: true

volumes:
  runner_state:
  platform_db:
  litellm_db:
