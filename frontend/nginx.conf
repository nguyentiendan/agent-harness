limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # IP limit at the trusted edge; do not trust client-supplied forwarding headers.
    location = /api/auth/login {
        limit_req zone=auth_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
    }

    # Proxy REST + SSE to the backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Serve the static Next.js export
    location / {
        try_files $uri $uri/ /index.html;
    }
}
